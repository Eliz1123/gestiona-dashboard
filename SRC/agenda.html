<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda del día | GESTIONA!</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="CSS/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js"></script>
</head>

<!-- Mejora seminario de proyectos II BR: página nueva, la agenda del día -->
<body class="bg-slate-50">

  <!-- Seminario de proyectos I BR: barra superior (el menú y el nombre los agrega JS/supabase.js - Mejora seminario de proyectos II BR) -->
  <nav class="nav">
    <div class="flex items-center space-x-2">
      <div class="relative flex items-center justify-center w-10 h-10">
        <span class="text-4xl font-serif font-black text-[#D82299] absolute -translate-x-2 -translate-y-1 z-20">G</span>
        <span class="text-4xl font-serif font-black text-[#3F2574] absolute translate-x-1.5 translate-y-1.5 z-10 opacity-90">T</span>
      </div>

      <div class="flex flex-col pl-4 leading-none">
        <span class="text-2xl font-black tracking-widest">GESTIONA!</span>
        <span class="text-[9px] text-slate-400 uppercase">Agenda del día</span>
      </div>
    </div>
  </nav>

  <main class="max-w-5xl mx-auto px-5 pt-32 pb-16">

    <!-- CABECERA -->
    <div class="flex flex-wrap items-end justify-between gap-4 mb-6">
      <div>
        <h1 class="text-3xl font-black text-[#3F2574]">Agenda del día</h1>
        <p class="text-slate-500 text-sm mt-1" id="textoFecha"></p>
      </div>

      <div class="flex flex-wrap items-end gap-3">
        <label class="text-xs text-slate-500 font-semibold">Día
          <input type="date" id="inputFecha"
            class="block border border-slate-200 rounded-full px-4 py-2 text-sm bg-white focus:outline-none focus:border-[#D82299]"
            style="width:auto; margin-top:2px;">
        </label>
        <label class="text-xs text-slate-500 font-semibold">Tickets por día
          <input type="number" id="limiteDia" min="1" max="50" value="10"
            class="block border border-slate-200 rounded-full px-4 py-2 text-sm bg-white focus:outline-none focus:border-[#D82299]"
            style="width:90px; margin-top:2px;">
        </label>
        <button id="btnGenerar" class="btn-main text-sm">Generar agenda</button>
        <button id="btnDescargar" class="btn-pdf text-sm font-semibold">Descargar lista</button>
      </div>
    </div>

    <p id="estadoAgenda" class="text-sm text-slate-400 mb-4 min-h-[20px]" role="status"></p>

    <!-- RESUMEN -->
    <section class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-8">
      <div class="bg-white rounded-2xl p-5 shadow-sm border-t-4 border-[#3F2574]">
        <div class="text-3xl font-black text-[#3F2574]" id="kpiTotal">0</div>
        <div class="text-sm text-slate-500">En la agenda</div>
      </div>
      <div class="bg-white rounded-2xl p-5 shadow-sm border-t-4 border-green-500">
        <div class="text-3xl font-black text-[#3F2574]" id="kpiHechos">0</div>
        <div class="text-sm text-slate-500">Hechos</div>
      </div>
      <div class="bg-white rounded-2xl p-5 shadow-sm border-t-4 border-[#F2A93B]">
        <div class="text-3xl font-black text-[#3F2574]" id="kpiBloqueados">0</div>
        <div class="text-sm text-slate-500">Bloqueados</div>
      </div>
      <div class="bg-white rounded-2xl p-5 shadow-sm border-t-4 border-[#D82299]">
        <div class="text-3xl font-black text-[#3F2574]" id="kpiTiempo">0 min</div>
        <div class="text-sm text-slate-500">Tiempo por hacer</div>
      </div>
    </section>

    <!-- LISTA -->
    <section id="listaAgenda" class="flex flex-col gap-4"></section>

    <!-- BLOQUEADOS QUE VUELVEN MÁS ADELANTE -->
    <details id="bloqueFuturo" class="mt-10 bg-white rounded-2xl shadow-sm p-5 hidden">
      <summary class="cursor-pointer font-bold text-[#3F2574]">
        Bloqueados que vuelven más adelante (<span id="nBloqueFuturo">0</span>)
      </summary>
      <ul id="listaBloqueFuturo" class="mt-4 flex flex-col gap-3"></ul>
    </details>

  </main>

  <script src="JS/supabase.js"></script>
  <script src="JS/agenda.js"></script>
</body>
</html>
